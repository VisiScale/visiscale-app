<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VisiScale Agency</title>

  <!-- PWA / iOS standalone -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VisiScale">
  <meta name="theme-color" content="#070c12">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/app-icon.svg">


  <link rel="stylesheet" href="/assets/app.css">
</head>

<body>
<script>
  // Agency dashboard. showApp sends clients away from here and admins here.
  window.IS_ADMIN_APP = true;
</script>
<script type="module" src="/assets/app.js"></script>

<div id="login-screen">
  <div class="login-card">
    <img src="/images/VisiScale-Logo-White.svg" alt="VisiScale" class="login-logo">
    <p class="login-sub">Sign in to your dashboard</p>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="you@yourbusiness.com">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="Your password">
    </div>
    <p id="login-error" class="login-error"></p>
    <button class="btn-primary" id="login-btn" onclick="signIn()">Sign In</button>
  </div>

</div>

<div id="app" hidden>

  <header class="app-header">
    <img src="/images/VisiScale-Logo-White.svg" alt="VisiScale">
  </header>

  <div class="content">

    <section id="tab-clients" class="tab-pane active" role="tabpanel">
      <div class="pane-head">
        <h1>Clients</h1>
        <p>Every business on the platform. Pick one to open its conversation.</p>
      </div>
      <div id="client-list" class="cust-list"><p class="cust-empty">Loading...</p></div>
    </section>

    <section id="tab-chat" class="tab-pane" role="tabpanel">

      <!-- Conversation list -->
      <div id="chat-list-view">
        <div class="pane-head">
          <h1>Messages</h1>
          <p>Every client conversation, most recent first.</p>
        </div>
        <div id="convo-list" class="convo-list"><p class="cust-empty">Loading...</p></div>
      </div>

      <!-- One conversation -->
      <div id="chat-detail-view" hidden>
        <div class="thread-head">
          <button class="thread-back" onclick="closeConversation()" aria-label="Back to all conversations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h1 id="thread-title">Conversation</h1>
        </div>

        <div id="chat-thread" class="chat-thread"><p class="cust-empty">Loading...</p></div>

        <form class="chat-composer" onsubmit="sendMessage(event)">
          <input id="chat-input" type="text" placeholder="Write a message" autocomplete="off" maxlength="2000">
          <button class="btn-primary chat-send" type="submit" id="chat-send">Send</button>
        </form>
      </div>

    </section>

  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" onclick="switchTab('clients', this)" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
      </svg>
      Clients
    </button>
    <button class="nav-btn" onclick="switchTab('chat', this)" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      Messages
    </button>
  </nav>

</div>

<script>
// Agency side. Clients are businesses; RLS lets an admin read them all.
async function loadClients() {
  const wrap = document.getElementById('client-list');
  const { data, error } = await sb
    .from('businesses')
    .select('id, name, created_at')
    .order('name');

  if (error) { wrap.innerHTML = '<p class="cust-empty">Could not load clients.</p>'; return; }
  if (!data.length) { wrap.innerHTML = '<p class="cust-empty">No clients yet.</p>'; return; }

  wrap.innerHTML = data.map(b => `
    <div class="cust-card" role="button" tabindex="0"
         onclick="openClient('${esc(b.id)}')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openClient('${esc(b.id)}')}">
      <div class="cust-top"><strong>${esc(b.name)}</strong></div>
      <p class="cust-line">Client since ${new Date(b.created_at).toLocaleDateString()}</p>
    </div>`).join('');
}

// ============================================================
// CONVERSATIONS
// ============================================================
let convos = [];

// iMessage timestamps: today shows a clock, this week a weekday, older a date.
function convoTime(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if ((now - d) < 7 * 86400000)
    return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: '2-digit' });
}

async function loadConversations() {
  const wrap = document.getElementById('convo-list');

  // Three small reads in parallel. Pulling every message and grouping in the
  // browser is fine at this size; if the list ever gets slow the fix is a
  // view returning one row per business, not a bigger limit here.
  const [biz, msgs, reads] = await Promise.all([
    sb.from('businesses').select('id, name').order('name'),
    sb.from('messages').select('business_id, body, sender_id, created_at')
      .order('created_at', { ascending: false }).limit(500),
    sb.from('message_reads').select('business_id, last_read_at'),
  ]);

  if (biz.error) { wrap.innerHTML = '<p class="cust-empty">Could not load conversations.</p>'; return; }

  // Messages came back newest first, so the first one seen per business is its latest.
  const latest = new Map();
  for (const m of msgs.data || []) if (!latest.has(m.business_id)) latest.set(m.business_id, m);
  const readAt = new Map((reads.data || []).map(r => [r.business_id, r.last_read_at]));

  convos = (biz.data || []).map(b => {
    const last = latest.get(b.id) || null;
    const seen = readAt.get(b.id);
    // Your own message is never unread, and a thread never read is unread on its first message.
    const unread = !!last
      && last.sender_id !== window.currentUserId
      && (!seen || new Date(seen) < new Date(last.created_at));
    return { id: b.id, name: b.name, last, unread };
  }).sort((a, b) => {
    if (!a.last && !b.last) return a.name.localeCompare(b.name);
    if (!a.last) return 1;                       // silent threads sink to the bottom
    if (!b.last) return -1;
    return new Date(b.last.created_at) - new Date(a.last.created_at);
  });

  if (!convos.length) { wrap.innerHTML = '<p class="cust-empty">No clients yet.</p>'; return; }

  wrap.innerHTML = convos.map(c => `
    <button class="convo${c.unread ? ' convo-unread' : ''}" onclick="openConversation('${esc(c.id)}')"
            aria-label="${esc(c.name)}${c.unread ? ', unread' : ''}">
      <span class="convo-dot" aria-hidden="true"></span>
      <span class="convo-body">
        <span class="convo-top">
          <span class="convo-name">${esc(c.name)}</span>
          <span class="convo-time">${c.last ? esc(convoTime(c.last.created_at)) : ''}</span>
        </span>
        <span class="convo-preview">${c.last ? esc(c.last.body) : 'No messages yet'}</span>
      </span>
    </button>`).join('');
}

async function openConversation(businessId) {
  const c = convos.find(x => x.id === businessId);
  document.getElementById('thread-title').textContent = c ? c.name : 'Conversation';
  document.getElementById('chat-list-view').hidden = true;
  document.getElementById('chat-detail-view').hidden = false;
  await openThread(businessId);
  await markRead(businessId);
}

function closeConversation() {
  document.getElementById('chat-detail-view').hidden = true;
  document.getElementById('chat-list-view').hidden = false;
  loadConversations();          // reflect anything read or sent while it was open
}

// Jump straight from a client row into their thread.
function openClient(businessId) {
  switchTab('chat', document.querySelectorAll('.nav-btn')[1]);
  openConversation(businessId);
}

// openThread subscribes to the open conversation only. This second subscription
// covers every other one, so a message arriving in a thread you are not looking
// at still moves it to the top of the list and lights its dot.
function watchAllThreads() {
  sb.channel('admin-all-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const listOpen = !document.getElementById('chat-list-view').hidden;
      if (listOpen) { loadConversations(); return; }
      // A message landing in the thread already on screen has been read on arrival.
      if (payload.new.business_id === window.currentThreadId) markRead(payload.new.business_id);
    })
    .subscribe();
}

async function onSignedIn(profile, userId) {
  loadClients();
  initChat(profile, userId);
  await loadConversations();
  watchAllThreads();
}
</script>

</body>
</html>
